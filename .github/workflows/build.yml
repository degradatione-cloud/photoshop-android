name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app-release.p12
            echo "keystore ok: $(stat -c%s app-release.p12) bytes"
          else
            echo "::warning::KEYSTORE_B64 secret missing — release will be debug-signed"
          fi

      - name: Read version
        id: ver
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "version $VN ($VC)"

      - name: Rust toolchain + targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ndk: $NDK"

      - name: Build PSD core (Rust → jniLibs)
        working-directory: rust
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release -p psd-jni
          find ../app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      - name: Rust PSD smoke test (off-device)
        working-directory: rust
        run: |
          cargo run --release -q -p psd-jni --bin mkpsd -- /tmp/test.psd
          cargo run --release -q -p psd-jni --bin psdinfo -- /tmp/test.psd /tmp/psdout | tee /tmp/psd.json
          grep -q '"ok":true' /tmp/psd.json
          ls -la /tmp/psdout

      - name: Unit tests (Robolectric composition smoke)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk "out/PhotoshopMobile-${{ steps.ver.outputs.name }}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/PhotoshopMobile-${{ steps.ver.outputs.name }}-debug.apk"
          ls -la out/

      - name: Upload test reports on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload debug artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ps-apk-${{ steps.ver.outputs.name }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (release APK only — in-app updater reads it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.name }}"
          NOTES="Claude Code for Android $(date -u +%Y-%m-%d) · build ${{ steps.ver.outputs.code }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/PhotoshopMobile-${{ steps.ver.outputs.name }}-release.apk" --clobber
          else
            gh release create "$TAG" "out/PhotoshopMobile-${{ steps.ver.outputs.name }}-release.apk" -t "Claude Code Android $TAG" -n "$NOTES"
          fi
          gh release view "$TAG" --json url,assets -q '.url + " → " + ([.assets[].name] | join(", "))'
